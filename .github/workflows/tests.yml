name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  safe:
    runs-on: ubuntu-latest
    # Throwaway container credentials. These take precedence over the
    # DB_* values in phpunit.xml, which don't override existing env vars.
    env:
      DB_DATABASE: chippytrip_api_testing
      DB_USERNAME: ci
      DB_PASSWORD: ci
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chippytrip_api_testing
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mailparse, pdo_mysql, redis, gd, zip, intl, bcmath
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit -c phpunit.xml tests/Safe
